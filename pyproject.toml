[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-services"
version = "0.1.0"
description = "Default template for PDM package"
authors = [
    {name = "Seungbin Yim", email = "ysb06@hotmail.com"},
]
dependencies = [
    "openai-whisper>=20250625",
    "whisperx>=3.8.5",
    "pyannote-audio>=4.0.4",
    "huggingface-hub>=0.36.2",
    "python-dotenv>=1.0.1",
    "PyYAML>=6.0.3",
    "tqdm>=4.66.0",
    "google-api-python-client>=2.197.0",
    "SQLAlchemy>=2.0.0",
    "yt-dlp[default]>=2026.6.9",
    "fastapi[standard]>=0.138.2",
    "bgutil-ytdlp-pot-provider==1.3.2",
    "av>=18.1.0",
    "numpy>=2.4.6",
    "Pillow>=12.3.0",
    "onnxruntime>=1.29.0",
    "ollama>=0.6.2",
    "opencv-python>=5.0.0.93",
]
requires-python = ">=3.11,<3.13"
readme = "README.md"
license = {text = "MIT"}


[tool.pdm]
distribution = true

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
