<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>ytcrawln · 클립 검수</title>
  <link rel="stylesheet" href="/static/review.css">
  <script defer src="/static/review.js"></script>
</head>
<body>
  <!-- Candidates, metadata, and clip playback use the original video without creating clip files. -->
  <div class="app-shell">
    <header class="page-header">
      <p class="eyebrow">FACE CLIP REVIEW</p>
      <h1>클립 검수</h1>
    </header>

    <main>
      <div class="review-workspace">
        <nav class="panel candidate-panel" aria-labelledby="candidate-title">
          <div class="panel-heading">
            <div class="heading-with-count"><h2 id="candidate-title">검수 대상</h2><span class="count-badge" id="clip-count">—</span></div>
          </div>
          <p class="candidate-list-message" id="clip-list-message" role="status" aria-live="polite">목록을 불러오는 중입니다.</p>
          <ol class="candidate-list" id="clip-list" aria-busy="true"></ol>
        </nav>

        <section class="panel player-panel" aria-label="영상 플레이어">
          <div class="video-stage">
            <video id="video-player" controls preload="metadata" playsinline hidden aria-label="선택한 원본 영상"></video>
            <!-- <div class="stage-labels"><span class="stage-badge">원본 영상</span><span class="aspect-label">16:9</span></div> -->
            <div class="video-placeholder" id="player-message" role="status" aria-live="polite">
              <span class="video-placeholder-icon" aria-hidden="true">
                <svg viewBox="0 0 48 48" fill="none"><rect x="7" y="10" width="34" height="28" rx="5" stroke="currentColor" stroke-width="1.5"/><path d="m21 18 9 6-9 6V18Z" fill="currentColor"/></svg>
              </span>
              <p id="player-message-title">검수 대상을 선택해 주세요.</p>
              <span id="player-message-detail">왼쪽 목록에서 후보를 선택하면 원본 영상을 불러옵니다.</span>
            </div>
          </div>

          <div class="clip-actions">
            <button class="clip-play-button" id="clip-play-button" type="button" disabled>
              <svg class="icon" viewBox="0 0 20 20" aria-hidden="true"><path d="m6 3 11 7L6 17V3Z" fill="currentColor"/></svg>
              클립 재생
            </button>
            <p class="clip-playback-message" id="clip-playback-message" role="status" aria-live="polite" hidden></p>
          </div>
        </section>

        <aside class="panel info-panel" aria-labelledby="info-title">
          <div class="panel-heading"><h2 id="info-title">영상 정보</h2></div>
          <div class="info-tabs" role="tablist" aria-label="영상 정보 탭">
            <button class="info-tab is-active" id="overview-tab" type="button" role="tab" aria-selected="true" aria-controls="overview-panel" tabindex="0">개요</button>
            <button class="info-tab" id="detail-tab" type="button" role="tab" aria-selected="false" aria-controls="detail-panel" tabindex="-1">상세</button>
          </div>
          <div class="metadata-scroll" id="metadata-content" aria-busy="false">
            <p class="metadata-message" id="metadata-message" role="status" aria-live="polite">검수 대상을 선택해 주세요.</p>
            <section id="overview-panel" role="tabpanel" aria-labelledby="overview-tab" tabindex="0"></section>
            <section id="detail-panel" role="tabpanel" aria-labelledby="detail-tab" tabindex="0" hidden></section>
          </div>
        </aside>
      </div>

      <section class="panel review-records" aria-labelledby="review-records-title">
        <div class="records-heading"><h2 id="review-records-title">Review 기록</h2><span class="neutral-badge">준비 중</span></div>
        <div class="records-placeholder">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="5" y="4" width="14" height="17" rx="2" stroke="currentColor" stroke-width="1.4"/><path d="M9 3h6v3H9V3Zm0 8h6m-6 4h4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <div><p>검수 기록을 위한 공간입니다.</p><span>판정과 메모는 다음 단계에서 추가됩니다.</span></div>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
